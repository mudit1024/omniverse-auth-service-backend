server:
  port: ${PORT:8080}
spring:
  application:
    name: auth-Service
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:postgresql://localhost:5432/omniverse
    username: postgres
    password: admin123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    console: "%d{HH:mm:ss} [%level] %logger{36} - %msg%n"

jwt:
  secret: your_super_secret_key_which_is_long
  expiration: 3600000