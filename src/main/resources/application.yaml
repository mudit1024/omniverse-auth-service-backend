server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  main:
    lazy-initialization: true
  application:
    name: auth-Service
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  pattern:
    console: "%d{HH:mm:ss} [%level] %logger{36} - %msg%n"

jwt:
  secret: your_super_secret_key_which_is_long
  expiration: 3600000